    - nome: sequencial
      rotulo: sequencial
      # MAN-10-201 rev. 04, item 5.2.6: três dígitos até 999; quatro sem zero inicial acima de 999.
      padrao_regex: "(?:\\d{3}|[1-9]\\d{3})"
  segmentos_identidade: [tipo, linha, trecho, subtrecho, unidade, etapa, classe, sequencial]
  revisao_no_codigo: false
emissao:
  revisao:
    preliminar: {serie: numerica, inicio: 1}
    original: {serie: zero_depois_letras, proibidas: [O]}
    reabertura: {serie: letra_mais_numero, inicio: A, proibidas: [O]}
  versao: {serie: numerica, inicio: 1}
analise:
  inicial: EM_ANALISE
  transicoes:
    NAO_CONFORME: nova_versao
    INCONSISTENTE: {acao: nova_versao, bloqueia_medicao: true}
    NAO_APROVADO: nova_revisao_preliminar
    APROVADO: emitir_original
    REABRIR: reabrir
    CANCELADO: fim_de_linha
painel:
  grupos: # A ordem desta lista é a ordem de exibição no painel.
    - id: a_emitir
      rotulo: A EMITIR
      cor: "#9aa0a6"
      sem_emissao: true
    - id: em_analise
      rotulo: EM ANÁLISE
      estados: ["Em Análise"]
    - id: aprovado
      rotulo: APROVADO
      # Os trâmites de aprovação e assinatura já contam como aprovado para o contrato.
      estados: ["Aprovado", "Para Aprovação", "Em coleta de Assinaturas"]
    - id: nao_aprovado
      rotulo: NÃO APROVADO
      estados: ["Não Aprovado"]
    - id: inconsistente
      rotulo: INCONSISTENTE
      cor: "#7857a5"
      estados: ["Inconsistente", "Não Conforme"]
    # D-041: erro de mecânica do PW, distinto de INCONSISTENTE (D-036), oculto para a chefia.
    - id: erro
      rotulo: ERRO
      cor: "#dc2626"
      oculto_no_painel: true
      estados: ["Em Desenvolvimento", "Erro de Assinatura"]
    - id: cancelado
      rotulo: CANCELADO
      estados: ["Cancelado"]
      conta_no_avanco: false
  # Revisão Superada é somente histórica, nunca a situação vigente.
  ignorar: ["Revisão Superada"]
  avanco: [aprovado]
  # D-077: o Início agrupa os documentos aguardando análise pelo código completo da classe.
  pacote:
    segmentos: [etapa, classe]
    nome_de: classe
  # D-052: categorias do painel seguem a coluna MODALIDADE da Lista Mestra; D-057: N3 (paisagismo e urbanismo) é ARQUITETURA.
  categorias:
    - id: qualidade
      rotulo: QUALIDADE
      regras:
        - tipo: [PE, MQ]
        - classe: [A7]
    - id: arquitetura
      rotulo: ARQUITETURA
      regras:
        - classe: [B3, B7, N3]
    - id: sistemas
      rotulo: SISTEMAS
      regras:
        - classe: [P0, P5, P6, P7, Q1, S5, S6, Z2]
    - id: civil
      rotulo: CIVIL
      regras: []
      padrao: true
  indicadores:
    # D-052: PE-ENG-001 item 5.5 define aprovação em até 3 revisões, sem meta percentual.
    # D-043/D-044: revisões contam emissões do primeiro ciclo; empacados não entram e a linha se chama Meta.
    - tipo: aprovacao_em_ate_n_revisoes
      id: aprovacao_ate_3_revisoes
      limite_revisoes: 3
      rotulo_meta: Meta
      agrupar_a_partir: 5
      contar_estourados_sem_aprovacao: false
      ciclos: primeira_aprovacao
prazos:
  # D-064: o acervo usa a região configurada para o contrato.
  feriados: {nacionais: true, regiao: {uf: SP, municipio: São Paulo}, extras: []}
  # PE-ENG-001, item 5.6: indicador satisfatório quando 80% ou mais dos prazos são cumpridos.
  meta_percentual: 80
  meta_cronograma: 80
  faixas_atraso:
    - {ate_dias: 5, rotulo: Leve}
    - {ate_dias: 30, rotulo: Moderado}
    - {ate_dias: 60, rotulo: Grave}
    - {ate_dias: null, rotulo: Crítico}
  regras:
    # Contrato, cláusula 25.1.2.1: o Metrô analisa em até 15 dias úteis desde a emissão no PW.
    - id: analise_cliente
      rotulo: Análise do cliente
      dias: 15
      tipo_dia: uteis
      inicio: emissao
      fim: analise
      meta_percentual: null # Prazo do cliente, sem meta (D-063).
      excecoes:
        # D-061: manuais com 30 dias úteis; sigla de treinamento a confirmar.
        - siglas: [MM, MO, MP, MQ, MU]
          dias: 30
    # Contrato, cláusula 25.1.2.3: devolução em até 15 dias corridos desde a análise do cliente.
    - id: devolucao_nossa
      rotulo: Nossa devolução
      dias: 15
      tipo_dia: corridos
      inicio: analise
      fim: proxima_emissao
      # D-062: Não Aprovado e INCONSISTENTE (inclui Inconsistente e Não Conforme).
      so_quando_grupo: [nao_aprovado, inconsistente]
