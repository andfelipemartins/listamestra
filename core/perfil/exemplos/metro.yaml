        DV: Dicionário de variáveis
        EB: Plano de execução BIM
        EE: Especificação de equipamento
        EM: Especificação de material
        EP: Especificação de processo
        EQ: Esquema unifilar e elétrico
        ER: Especificação de requisitos de sistema
        ES: Especificação de serviço
        ET: Especificação técnica
        FT: Formulário de teste
        GC: Roteiro de manutenção preventiva
        GM: Plano de atividades de manutenção
        GP: Planilha de atividades e tempos
        GV: Atividades de manutenção preventiva
        GZ: Parâmetros para programação
        HR: Especificação de requisitos de hardware
        IC: Instrução complementar
        ID: Índice de documentos
        IP: Instrução de projeto
        IT: Instrução técnica
        LC: Lista de cabos
        LM: Lista de material
        LS: Lista de peças sobressalentes
