        MP: Manual de geração de software
        MQ: Manual de programa de qualidade
        MU: Manual do usuário
        NS: Nota de serviço
        OB: Projeto de objeto BIM
        OR: Planilha para orçamento
        PC: Procedimento de conservação
        PE: Procedimento executivo
        PF: Plano de inspeção e testes em fábrica
        PG: Programas de computador
        PI: Procedimento de inspeção
        PL: Procedimento de teste de instalação
        PM: Procedimento de treinamento
        PN: Procedimento de montagem
        PP: Projeto padrão
        PQ: Plano de qualidade de software
        PS: Procedimento de segurança do trabalho
        PT: Procedimento de teste
        PV: Procedimento de movimentação de cargas
        RS: Relatório de serviços executados
        RT: Relatório técnico
        RZ: Diretrizes técnicas e operacionais
        SM: Listagem de simulação
        SR: Especificação de requisitos de software
        TA: Tabela de altitudes
        TC: Tabela de coordenadas
        TR: Plano de treinamento
